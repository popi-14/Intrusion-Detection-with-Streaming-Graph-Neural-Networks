services:
  streaming-gnn-ids:
    build: .
    container_name: streaming-gnn-ids
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "5000"
      DATASET_PATH: /data
      TRAINING_FRACTION: "0.8"
      REPLAY_BATCH_SIZE: "128"
      REPLAY_INTERVAL_SECONDS: "0.25"
    volumes:
      - ../DataSet:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
